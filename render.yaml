services:
  - type: web
    name: dental-price-matcher-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://dental-price-matcher.vercel.app
      - key: PYTHON_VERSION
        value: "3.12"
